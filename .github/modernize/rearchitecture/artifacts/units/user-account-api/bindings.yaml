unit: user-account-api
bindings:
  - type: route-declaration
    name: "GET /api/users/{Id}"
    source_loc: user/src/main/java/com/ecommerce/user/controller/userController.java:31
    target: "userController.getUserById"
    must_appear_in_target: true
    notes: "Returns User entity JSON."
  - type: route-declaration
    name: "DELETE /api/users/{Id}"
    source_loc: user/src/main/java/com/ecommerce/user/controller/userController.java:36
    target: "userController.deleteUserById"
    must_appear_in_target: true
    notes: "Service deletes the user; controller calls no-content builder."
  - type: route-declaration
    name: "GET /api/users"
    source_loc: user/src/main/java/com/ecommerce/user/controller/userController.java:42
    target: "userController.getUserAll"
    must_appear_in_target: true
    notes: "Returns List<User> JSON."
  - type: route-declaration
    name: "POST /api/users"
    source_loc: user/src/main/java/com/ecommerce/user/controller/userController.java:47
    target: "userController.createUser"
    must_appear_in_target: true
    notes: "Consumes User JSON and currently responds with status 210."
  - type: route-declaration
    name: "PUT /api/users/{Id}"
    source_loc: user/src/main/java/com/ecommerce/user/controller/userController.java:53
    target: "userController.updateUser"
    must_appear_in_target: true
    notes: "User argument has no @RequestBody annotation in the inspected source."
  - type: filter
    name: "HTTP Basic SecurityFilterChain"
    source_loc: user/src/main/java/com/ecommerce/user/config/securityConfig.java:14
    target: "All HTTP requests in user application"
    must_appear_in_target: true
    notes: "CSRF is disabled; every request is authenticated using HTTP Basic."
